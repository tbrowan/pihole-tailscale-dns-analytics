# Runs the dashboard tests on every push and pull request.
# The tests mock the database, so no MariaDB is needed here.
name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # same as the Pi
      - run: pip install -r requirements.txt
      - run: python -m unittest dashboard/test_app.py -v
